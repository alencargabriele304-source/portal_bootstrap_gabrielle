<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="index.html" class="navbar-brand fw-bold">Portal de Desafios</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Início</a></li>
                    <li class="nav-item"><a href="index1.html" class="nav-link">Desafio 01</a></li>
                    <li class="nav-item"><a href="index2.html" class="nav-link">Desafio 02</a></li>
                    <li class="nav-item"><a href="index3.html" class="nav-link">Desafio 03</a></li>

                    <li class="nav-item"><a href="index5.html" class="nav-link">Desafio 05</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-sm p-4">
                <h3 class="mb-2">Ordem de Serviço</h3>
                <p class="text-muted mb-4">Preencha os dados para solicitar um atendimento.</p>
                <form>
                    <div class="row g-3">
                        <div class="col-sm-6"><label class="form-label">Nome</label><input type="text" class="form-control" placeholder="Seu nome" required></div>
                        <div class="col-sm-6"><label class="form-label">Sobrenome</label><input type="text" class="form-control" placeholder="Seu sobrenome" required></div>
                        <div class="col-12"><label class="form-label">E-mail</label><input type="email" class="form-control" placeholder="seuemail@email.com" required></div>
                        <div class="col-12"><label class="form-label">Telefone / WhatsApp</label><div class="input-group"><span class="input-group-text">+55</span><input type="tel" class="form-control" placeholder="(41) 99999-9999" required></div></div>
                        <div class="col-12"><label class="form-label">Tipo de Serviço</label><select class="form-select" required><option value="" selected disabled>Escolha um serviço...</option><option value="manutencao">Manutenção</option><option value="instalacao">Instalação</option><option value="reparo">Reparo</option><option value="outro">Outro</option></select></div>
                        <div class="col-12"><label class="form-label">Descrição do problema ou serviço</label><textarea class="form-control" rows="4" placeholder="Explique o que precisa ser feito..." required></textarea></div>
                        <div class="col-12"><div class="form-check"><input type="checkbox" id="confirmacao" class="form-check-input" required><label for="confirmacao" class="form-check-label">Confirmo que as informações preenchidas estão corretas.</label></div></div>
                        <div class="col-12 mt-4"><button class="btn btn-success w-100" type="submit">Enviar Ordem de Serviço</button></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
